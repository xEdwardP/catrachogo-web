<!doctype html>
<html lang="es" class="bg-cream dark:bg-gray-950">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_without_text.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catracho Go</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('catrachogo_theme');
          var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (error) {}
      })();
    </script>
  </head>
  <body class="bg-cream dark:bg-gray-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
